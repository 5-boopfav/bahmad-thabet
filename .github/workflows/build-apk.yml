name: Build BAHMAD THABET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: flutter create . --platforms=android

      - name: Generate Sound WAV Files
        run: |
          mkdir -p assets/sounds
          python3 - << 'EOF'
          import math, struct, wave

          def make_tone(path, freqs, duration_s, volume=0.4, decay=True):
              sample_rate = 44100
              n_samples = int(sample_rate * duration_s)
              with wave.open(path, "w") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(sample_rate)
                  for i in range(n_samples):
                      t = i / sample_rate
                      env = (1.0 - (i / n_samples)) ** 1.8 if decay else 1.0
                      val = 0.0
                      for f in freqs:
                          val += math.sin(2.0 * math.pi * f * t)
                      val = (val / max(1, len(freqs))) * volume * env
                      sample = int(max(-1.0, min(1.0, val)) * 32767)
                      wav.writeframes(struct.pack("<h", sample))

          make_tone("assets/sounds/place.wav", [220, 440], 0.09, volume=0.45)
          make_tone("assets/sounds/mill.wav", [523.25, 659.25, 783.99], 0.24, volume=0.42)
          make_tone("assets/sounds/remove.wav", [330, 196], 0.12, volume=0.4)
          EOF

      - name: Set App Display Name & Custom Icon
        run: |
          python3 - << 'EOF'
          import os, re, shutil, struct, zlib

          candidates = [
              "Image_57d593b5.jpg",
              "assets/icon/Image_57d593b5.jpg",
          ]
          src_icon = next((p for p in candidates if os.path.exists(p)), None)

          if src_icon is None:
              os.makedirs("assets/icon", exist_ok=True)
              src_icon = "assets/icon/Image_57d593b5.jpg"
              w, h = 512, 512
              row = bytes([0]) + bytes([220, 164, 99, 255] * w)
              raw = row * h

              def png_chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              idat = zlib.compress(raw, level=6)
              png_bytes = (
                  b"\x89PNG\r\n\x1a\n"
                  + png_chunk(b"IHDR", ihdr)
                  + png_chunk(b"IDAT", idat)
                  + png_chunk(b"IEND", b"")
              )
              with open(src_icon, "wb") as f:
                  f.write(png_bytes)

          res_dir = "android/app/src/main/res"
          for folder in [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi",
          ]:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              shutil.copyfile(src_icon, os.path.join(target_dir, "ic_launcher.png"))

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'android:label="[^"]*"', 'android:label="ثبت"', content)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Update Home Screen Brand Text
        run: |
          python3 - << 'EOF'
          import os, re

          path = "lib/main.dart"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              text = re.sub(
                  r"(?<!•\s)BAHMAD THABET",
                  "بحمــــــــــــــــد 👑",
                  text,
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK Output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Bahmad-Thabet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahmad-Thabet-APK
          path: build/app/outputs/flutter-apk/Bahmad-Thabet.apk
