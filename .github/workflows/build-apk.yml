name: Build BAHMAD THABET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: flutter create . --platforms=android

      - name: Generate Sound WAV Files
        run: |
          mkdir -p assets/sounds
          python3 - << 'EOF'
          import math, struct, wave

          def make_tone(path, freqs, duration_s, volume=0.4, decay=True):
              sample_rate = 44100
              n_samples = int(sample_rate * duration_s)
              with wave.open(path, "w") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(sample_rate)
                  for i in range(n_samples):
                      t = i / sample_rate
                      env = (1.0 - (i / n_samples)) ** 1.8 if decay else 1.0
                      val = 0.0
                      for f in freqs:
                          val += math.sin(2.0 * math.pi * f * t)
                      val = (val / max(1, len(freqs))) * volume * env
                      sample = int(max(-1.0, min(1.0, val)) * 32767)
                      wav.writeframes(struct.pack("<h", sample))

          make_tone("assets/sounds/place.wav", [220, 440], 0.09, volume=0.45)
          make_tone("assets/sounds/mill.wav", [523.25, 659.25, 783.99], 0.24, volume=0.42)
          make_tone("assets/sounds/remove.wav", [330, 196], 0.12, volume=0.4)
          EOF

      - name: Set App Display Name & Custom Icon
        run: |
          python3 - << 'EOF'
          import os, re, shutil, subprocess, sys

          candidates = [
              "image_57d593b5.jpg",
              "Image_57d593b5.jpg",
              "assets/icon/image_57d593b5.jpg",
              "assets/icon/Image_57d593b5.jpg",
          ]
          src_icon = next((p for p in candidates if os.path.isfile(p)), None)

          if src_icon is None:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in {".git", "android", "build", ".dart_tool"}]
                  for fn in files:
                      if "57d593b5" in fn.lower() or fn.lower().endswith((".jpg", ".jpeg", ".png", ".webp")):
                          src_icon = os.path.join(root, fn)
                          break
                  if src_icon:
                      break

          if not src_icon or not os.path.isfile(src_icon):
              print("ERROR: Could not find icon image in repository.")
              sys.exit(1)

          os.makedirs("assets/icon", exist_ok=True)
          converted_png = "assets/icon/ic_launcher_converted.png"

          def is_valid_png(path):
              if not os.path.isfile(path) or os.path.getsize(path) < 16:
                  return False
              with open(path, "rb") as f:
                  return f.read(8) == b"\x89PNG\r\n\x1a\n"

          def convert_with_pil(src, dst):
              try:
                  from PIL import Image
                  with Image.open(src) as im:
                      im = im.convert("RGBA").resize((512, 512))
                      im.save(dst, format="PNG")
                  return is_valid_png(dst)
              except Exception:
                  return False

          png_ok = convert_with_pil(src_icon, converted_png)

          if not png_ok and shutil.which("apt-get"):
              subprocess.run(["sudo", "apt-get", "update", "-qq"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              subprocess.run(["sudo", "apt-get", "install", "-y", "-qq", "python3-pil"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              png_ok = convert_with_pil(src_icon, converted_png)

          if not png_ok and shutil.which("ffmpeg"):
              res = subprocess.run(["ffmpeg", "-y", "-i", src_icon, "-vf", "scale=512:512", converted_png], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              png_ok = res.returncode == 0 and is_valid_png(converted_png)

          if not png_ok and shutil.which("convert"):
              res = subprocess.run(["convert", src_icon, "-resize", "512x512!", converted_png], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              png_ok = res.returncode == 0 and is_valid_png(converted_png)

          if not png_ok:
              print("ERROR: Failed to convert source image into valid PNG.")
              sys.exit(1)

          res_dir = "android/app/src/main/res"
          if os.path.isdir(res_dir):
              for entry in os.listdir(res_dir):
                  if entry.startswith("mipmap-anydpi"):
                      shutil.rmtree(os.path.join(res_dir, entry), ignore_errors=True)

          for folder in [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi",
          ]:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              for stale in [
                  "ic_launcher.xml",
                  "ic_launcher.webp",
                  "ic_launcher_round.xml",
                  "ic_launcher_round.webp",
                  "ic_launcher_foreground.png",
                  "ic_launcher_foreground.webp",
                  "ic_launcher_background.png",
                  "ic_launcher_background.webp",
              ]:
                  stale_path = os.path.join(target_dir, stale)
                  if os.path.exists(stale_path):
                      os.remove(stale_path)
              shutil.copyfile(converted_png, os.path.join(target_dir, "ic_launcher.png"))
              shutil.copyfile(converted_png, os.path.join(target_dir, "ic_launcher_round.png"))

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'android:label="[^"]*"', 'android:label="ثبت"', content)
              content = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', content)
              content = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', content)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Configure Firebase Android
        env:
          APPLICATION_ID: com.bahmad.thabet
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - << 'EOF'
          import os, re

          app_id = os.environ.get("APPLICATION_ID", "com.bahmad.thabet").strip()
          raw_json = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()

          root_gradle = "android/build.gradle"
          root_gradle_kts = "android/build.gradle.kts"
          app_gradle = "android/app/build.gradle"
          app_gradle_kts = "android/app/build.gradle.kts"

          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = re.sub(r'applicationId\s+"[^"]*"', f'applicationId "{app_id}"', txt)
              txt = re.sub(r"applicationId\s+'[^']*'", f"applicationId '{app_id}'", txt)
              with open(app_gradle, "w", encoding="utf-8") as f:
                  f.write(txt)

          if os.path.exists(app_gradle_kts):
              with open(app_gradle_kts, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = re.sub(r'applicationId\s*=\s*"[^"]*"', f'applicationId = "{app_id}"', txt)
              with open(app_gradle_kts, "w", encoding="utf-8") as f:
                  f.write(txt)

          if raw_json:
              os.makedirs("android/app", exist_ok=True)
              with open("android/app/google-services.json", "w", encoding="utf-8") as f:
                  f.write(raw_json)

              if os.path.exists(root_gradle):
                  with open(root_gradle, "r", encoding="utf-8") as f:
                      txt = f.read()
                  if "com.google.gms:google-services" not in txt:
                      txt = re.sub(
                          r"(dependencies\s*\{)",
                          r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",
                          txt,
                          count=1,
                      )
                  with open(root_gradle, "w", encoding="utf-8") as f:
                      f.write(txt)

              if os.path.exists(root_gradle_kts):
                  with open(root_gradle_kts, "r", encoding="utf-8") as f:
                      txt = f.read()
                  if "com.google.gms.google-services" not in txt:
                      txt += '\nplugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false\n}\n'
                  with open(root_gradle_kts, "w", encoding="utf-8") as f:
                      f.write(txt)

              if os.path.exists(app_gradle):
                  with open(app_gradle, "r", encoding="utf-8") as f:
                      txt = f.read()
                  if "com.google.gms.google-services" not in txt:
                      txt += "\napply plugin: 'com.google.gms.google-services'\n"
                  with open(app_gradle, "w", encoding="utf-8") as f:
                      f.write(txt)

              if os.path.exists(app_gradle_kts):
                  with open(app_gradle_kts, "r", encoding="utf-8") as f:
                      txt = f.read()
                  if "com.google.gms.google-services" not in txt:
                      txt = re.sub(
                          r"(plugins\s*\{)",
                          r'\1\n    id("com.google.gms.google-services")',
                          txt,
                          count=1,
                      )
                  with open(app_gradle_kts, "w", encoding="utf-8") as f:
                      f.write(txt)
          EOF

      - name: Update Home Screen Brand Text
        run: |
          python3 - << 'EOF'
          import os, re

          path = "lib/main.dart"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              text = re.sub(
                  r"(?<!•\s)BAHMAD THABET",
                  "بحمــــــــــــــــد 👑",
                  text,
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF

      - name: Update Computer Player Name
        run: |
          python3 - << 'EOF'
          import os, re

          path = "lib/main.dart"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              text = re.sub(
                  r"(?<=['\"])الكمبيوتر(?=['\"])",
                  "الكمبيوتر🤖 (بحمد)",
                  text,
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK Output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Bahmad-Thabet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Bahmad-Thabet-APK
          path: build/app/outputs/flutter-apk/Bahmad-Thabet.apk
